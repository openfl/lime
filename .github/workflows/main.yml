  package-haxelib:
    needs: [linux, macos, macos-intel, windows, android, ios]
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.53.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.53/hxcpp-4.3.53.zip
          haxelib install ../hxcpp-4.3.53.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install svg --quiet
          haxelib install openfl --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi
          cp project/lib/hashlink/other/osx/entitlements.xml templates/bin/hl/entitlements.xml
          mkdir templates/bin/hl/include
          cp project/lib/hashlink/src/hlc.h templates/bin/hl/include/hlc.h
          cp project/lib/hashlink/src/hl.h templates/bin/hl/include/hl.h
          cp project/lib/hashlink/src/hlc_main.c templates/bin/hl/include/hlc_main.c

      - uses: actions/download-artifact@v8
        with:
          name: Android-NDLL
          path: ndll/Android/

      - uses: actions/download-artifact@v8
        with:
          name: iPhone-NDLL
          path: ndll/iPhone/

      # - uses: actions/download-artifact@v8
      #   with:
      #     name: Linux-NDLL
      #     path: ndll/Linux/

      - uses: actions/download-artifact@v8
        with:
          name: Linux64-NDLL
          path: ndll/Linux64/

      - uses: actions/download-artifact@v8
        with:
          name: Mac64-NDLL
          path: ndll/Mac64/

      - uses: actions/download-artifact@v8
        with:
          name: MacArm64-NDLL
          path: ndll/MacArm64/

      - uses: actions/download-artifact@v8
        with:
          name: Windows-NDLL
          path: ndll/Windows/

      - uses: actions/download-artifact@v8
        with:
          name: Windows64-NDLL
          path: ndll/Windows64/

      # - uses: actions/download-artifact@v8
      #   with:
      #     name: Windows-Hashlink
      #     path: templates/bin/hl/Windows

      - uses: actions/download-artifact@v8
        with:
          name: Windows64-Hashlink
          path: templates/bin/hl/Windows64

      - uses: actions/download-artifact@v8
        with:
          name: Mac64-Hashlink
          path: templates/bin/hl/Mac64

      - uses: actions/download-artifact@v8
        with:
          name: Linux64-Hashlink
          path: templates/bin/hl/Linux64

      - name: Rebuild Lime run.n
        working-directory: tools
        run: |
          haxe run.hxml

      - name: Rebuild Lime svg.n
        working-directory: tools
        run: |
          haxe svg.hxml

      - uses: actions/upload-artifact@v7
        with:
          name: lime-haxelib
          path: |
            ./
            !project/
            !haxe-*-*/
            !neko-*-*/
            !.git/
          compression-level: 9
          if-no-files-found: error

