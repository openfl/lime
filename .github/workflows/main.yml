  android:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ndk-version: [r28c, stable]
      fail-fast: false
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        if: matrix.ndk-version != 'stable'
        with:
          ndk-version: ${{ matrix.ndk-version }}

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            StageWebView 1.1.0
            wsproto 1.0.0
            format 3.8.0
            hxp 1.3.1

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Prepare Lime
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime setup -alias -y -nocffi -eval

      - name: Configure Android support
        run: |
          lime config ANDROID_SDK $ANDROID_HOME -eval
          lime config ANDROID_NDK_ROOT ${{ env.LIME_NDK_ROOT }} -eval
          lime config JAVA_HOME $JAVA_HOME -eval
          lime config ANDROID_SETUP true -eval
          lime config -eval
        env:
          LIME_NDK_ROOT: ${{ matrix.ndk-version == 'stable' && '$ANDROID_NDK_ROOT' || steps.setup-ndk.outputs.ndk-path }}

      - name: Rebuild Lime (Android)
        timeout-minutes: 90
        run: |
          lime rebuild android -release -nocolor -verbose -nocffi -eval

      - name: Check Lime's mbedTLS names (Android)
        run: |
          haxe --cwd project/lib/custom/mbedtls --run GeneratePrefix -check ../../../obj

      - uses: actions/upload-artifact@v7
        with:
          name: Android-NDLL
          path: |
            ndll/Android/
            !**/.gitignore
          if-no-files-found: error
        if: matrix.ndk-version != 'stable'

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor -eval
          lime build HelloWorld android -release -verbose -nocolor -eval

      # 64-bit devices with 16 KB pages need every LOAD segment aligned to 16 KB
      - name: Check 64-bit libraries are 16 KB aligned (Android)
        run: |
          ndk=${{ matrix.ndk-version == 'stable' && '$ANDROID_NDK_ROOT' || steps.setup-ndk.outputs.ndk-path }}
          readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          files=$(ls ndll/Android/liblime-64.so ndll/Android/liblime-x86_64.so 2>/dev/null; find HelloWorld/Export/android/bin/app/src/main/jniLibs \( -path '*/arm64-v8a/*' -o -path '*/x86_64/*' \) -name '*.so')
          [ -n "$files" ] || { echo "No 64-bit libraries found"; exit 1; }
          failed=0
          for file in $files; do
            aligns=$("$readelf" -lW "$file" | awk '$1 == "LOAD" { print $NF }')
            echo "$file: $aligns"
            for align in $aligns; do
              [ $((align)) -ge 16384 ] || failed=1
            done
          done
          exit $failed

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor -eval
          lime build SimpleImage android -release -verbose -nocolor -eval

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor -eval
          lime build SimpleAudio android -release -verbose -nocolor -eval

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor -eval
          lime build SimpleVideo android -release -verbose -nocolor -eval

      - name: Build Vulkan smoke test app
        working-directory: tests/vulkan-smoke
        run: |
          lime build android -release -verbose -nocolor -eval

