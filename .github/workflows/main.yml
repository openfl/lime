  notify:
    runs-on: ubuntu-22.04
    needs: [package-haxelib, docs, android, flash-samples, air-samples, hashlink-samples, hashlinkc-samples, html5-samples, ios, linux, linux-arm64, vulkan-smoke, macos, macos-intel, neko-samples, webassembly, windows]
    # Reports failures too, which is when it matters most
    if: ${{ always() && github.repository == 'openfl/lime' && github.event_name != 'pull_request' }}
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "[${{ github.repository }}] ${{ github.workflow }}"
        run: |
          # One message for the run, naming the jobs that did not pass. Discord
          # takes at most 25 fields in a message, fewer than the jobs here, so
          # they go in its description, and a message it turns down fails this.
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" --jq '[.jobs[] | select(.name != "notify")]')
          failed=$(echo "$jobs" | jq -r '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | map("[\(.name)](\(.html_url)): \(.conclusion)") | join("\n")')

          if [ -z "$failed" ]; then status=Success; color=1560392; else status=Failure; color=15148839; fi

          commit="${{ github.sha }}"
          description="\`${commit:0:8}\` $(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
          [ -n "$failed" ] && description="$description"$'\n\n'"$failed"

          payload=$(jq -n --arg title "$TITLE: $status" --arg url "$RUN_URL" --arg actor "$ACTOR" --arg description "$description" --argjson color "$color" '{
            username: "GitHub Actions",
            avatar_url: "https://avatars0.githubusercontent.com/u/44036562?s=200&v=4",
            embeds: [{
              author: {name: $actor, url: ("https://github.com/" + $actor), icon_url: ("https://github.com/" + $actor + ".png")},
              title: $title, url: $url, description: $description, color: $color
            }]
          }')

          curl --fail-with-body --silent --show-error -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"
