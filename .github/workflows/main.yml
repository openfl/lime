name: CI
on: [push, pull_request, workflow_dispatch]

# A newer run of the same kind on the same branch or pull request replaces one still
# going. Push and pull request runs are kept apart, so neither cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.2.5
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  HXCPP_NONINTERACTIVE: 1

jobs:

  # In openfl/lime, a push only runs CI on the long-lived branches: a branch with a
  # pull request is tested by the pull request's run, which would otherwise run the
  # same jobs again. In forks every push runs, and any branch can be run by hand.
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: echo "run=${{ github.event_name != 'push' || github.repository != 'openfl/lime' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || endsWith(github.ref, '-dev') || endsWith(github.ref, '-Dev') || startsWith(github.ref, 'refs/heads/train/') }}" >> "$GITHUB_OUTPUT"

  linux:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev g++-multilib gcc-multilib libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev
          # GStreamer decodes video in the unit tests
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav xvfb libgl1-mesa-dri
          # OpenAL Soft needs C++20, and GCC 11 is the Ubuntu 22.04 default
          sudo apt-get install -y g++-12 g++-12-multilib
          echo "CXX=g++-12" >> $GITHUB_ENV

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            wsproto 1.0.0
            crossbyte 1.0.1
            haxelib 4.2.0
            StageWebView 1.1.0
            format 3.8.0
            hxp 1.3.1
            utest 1.13.2

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Run tools tests
        working-directory: tests/tools
        # Parses project files from Lime's own source, so needs no native library
        run: haxe test.hxml

      # CrossByte, which serves lime test html5, needs Haxe 4.3 to build the tools
      - uses: ./.github/actions/rebuild-lime-tools
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set up Lime
        run: |
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (Linux)
        # A rebuild takes up to about 30 minutes (iOS). libhxcpp can leave a failed build running, so
        # a compile error would otherwise hold the runner until the job times out after 6 hours
        timeout-minutes: 90
        run: |
          lime rebuild linux -32 -release -nocolor -verbose -nocffi
          lime rebuild linux -64 -release -nocolor -verbose -nocffi
          lime rebuild hl -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Linux-NDLL
          path: |
            ndll/Linux/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Linux64-NDLL
          path: |
            ndll/Linux64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Linux64-Hashlink
          path: |
            templates/bin/hl/Linux64
          if-no-files-found: error

      - uses: actions/setup-python@v6
        id: tls-python
        with:
          python-version: '3.12'

      - name: Run unit tests
        working-directory: tests/unit
        # A deadlock hangs the tests rather than failing them
        timeout-minutes: 30
        env:
          LIME_TEST_PYTHON: ${{ steps.tls-python.outputs.python-path }}
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
          # The clipboard tests replace what the clipboard holds, so they only run here
          LIME_TEST_CLIPBOARD: "1"
          # The trash tests move files to the user's trash, so they only run here
          LIME_TEST_TRASH: "1"
          # NetworkInterfaceTest changes the network with sudo to see onChange, so it only runs here
          LIME_TEST_NETWORK: "1"
        run: |
          python -m unittest discover -s fixtures
          # The test app exits when its first window cannot be made, so it needs a display
          xvfb-run -a lime test neko -release -verbose -nocolor
          xvfb-run -a lime test hl -release -verbose -nocolor
          xvfb-run -a lime test linux -release -verbose -nocolor

      - name: Check a plain hxml HashLink build
        working-directory: tests/plain-hxml
        timeout-minutes: 10
        run: haxe --run Run

      - name: Run OpenGL tests
        working-directory: tests/unit
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: "x11"
        run: |
          xvfb-run -a lime test neko -release -verbose -nocolor -DUTEST_PATTERN=OpenGLTest -Dlime_test_require_opengl
          xvfb-run -a lime test hl -release -verbose -nocolor -DUTEST_PATTERN=OpenGLTest -Dlime_test_require_opengl
          xvfb-run -a lime test linux -release -verbose -nocolor -DUTEST_PATTERN=OpenGLTest -Dlime_test_require_opengl

      - name: Check window creation failure and recovery
        working-directory: tests/window-creation
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a lime test neko -release -verbose -nocolor
          xvfb-run -a lime test hl -release -verbose -nocolor
          xvfb-run -a lime test linux -release -verbose -nocolor
          lime build neko -release -verbose -nocolor -Dwindow_creation_startup_failure
          python check_startup.py bin/neko/bin/WindowCreationTest

      - name: Run WebView tests
        working-directory: tests/unit
        # WebKitGTK needs a display, so the tests above do not reach it
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-0
          xvfb-run -a lime test neko -release -verbose -nocolor -DUTEST_PATTERN=WebViewTest
          xvfb-run -a lime test hl -release -verbose -nocolor -DUTEST_PATTERN=WebViewTest
          xvfb-run -a lime test linux -release -verbose -nocolor -DUTEST_PATTERN=WebViewTest

      - name: Run software OpenGL tests
        working-directory: tests/unit
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          # Skips the GPU, as on a machine without one
          LIME_SOFTWARE_GL: "1"
        run: |
          xvfb-run -a lime test linux -release -verbose -nocolor -Dsoftware-gl -DUTEST_PATTERN=OpenGLTest -Dlime_test_require_opengl

      - name: Run unit tests past 24.8 days
        working-directory: tests/unit
        # A timer stuck at the Int limit hangs the tests rather than failing them
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          # The timer starts 10 s short of 2^31 ms, where an Int millisecond count
          # runs out, so the tests run on across it
          xvfb-run -a lime test linux -release -verbose -nocolor -Dsimulate_uptime=2147473648

      - name: Run video smoke test
        working-directory: tests/video-smoke
        run: |
          lime build linux -release -verbose -nocolor
          SDL_AUDIODRIVER=dummy xvfb-run -a Export/linux/bin/LimeVideoSmoke

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld linux -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage linux -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio linux -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo linux -release -verbose -nocolor

  linux-arm64:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04-arm
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev
          # GStreamer decodes video in the unit tests
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav xvfb libgl1-mesa-dri
          # OpenAL Soft needs C++20, and GCC 11 is the Ubuntu 22.04 default
          sudo apt-get install -y g++-12
          echo "CXX=g++-12" >> $GITHUB_ENV

      # krdlab/setup-haxe doesn't support arm64 linux
      # so this is our workaround for now
      - name: Install Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          # Launchpad sometimes answers 503 for a while; retry rather than fail the job
          sudo apt-get install -y -o Acquire::Retries=5 haxe
          mkdir $HOME/haxelib
          haxelib setup $HOME/haxelib

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            wsproto 1.0.0
            crossbyte 1.0.1
            haxelib 4.2.0
            StageWebView 1.1.0
            format 3.8.0
            hxp 1.3.1
            utest 1.13.2

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (Linux ARM64)
        timeout-minutes: 90
        run: |
          lime rebuild linux -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: LinuxArm64-NDLL
          path: |
            ndll/LinuxArm64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/setup-python@v6
        id: tls-python
        with:
          python-version: '3.12'

      - name: Run unit tests
        working-directory: tests/unit
        env:
          LIME_TEST_PYTHON: ${{ steps.tls-python.outputs.python-path }}
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
          # The clipboard tests replace what the clipboard holds, so they only run here
          LIME_TEST_CLIPBOARD: "1"
          # The trash tests move files to the user's trash, so they only run here
          LIME_TEST_TRASH: "1"
          # NetworkInterfaceTest changes the network with sudo to see onChange, so it only runs here
          LIME_TEST_NETWORK: "1"
        run: |
          python -m unittest discover -s fixtures
          # The test app exits when its first window cannot be made, so it needs a display
          xvfb-run -a lime test neko -release -verbose -nocolor
          xvfb-run -a lime test linux -release -verbose -nocolor
        # The package waits for this job, so a hang must not hold it for hours
        timeout-minutes: 60

      - name: Run OpenGL tests
        working-directory: tests/unit
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: "x11"
        run: |
          xvfb-run -a lime test neko -release -verbose -nocolor -DUTEST_PATTERN=OpenGLTest -Dlime_test_require_opengl
          xvfb-run -a lime test linux -release -verbose -nocolor -DUTEST_PATTERN=OpenGLTest -Dlime_test_require_opengl

      - name: Check window creation failure and recovery
        working-directory: tests/window-creation
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a lime test neko -release -verbose -nocolor
          xvfb-run -a lime test linux -release -verbose -nocolor
          lime build neko -release -verbose -nocolor -Dwindow_creation_startup_failure
          python check_startup.py bin/neko/bin/WindowCreationTest

      - name: Run WebView tests
        working-directory: tests/unit
        # WebKitGTK needs a display, so the tests above do not reach it
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
          xvfb-run -a lime test neko -release -verbose -nocolor -DUTEST_PATTERN=WebViewTest
          xvfb-run -a lime test linux -release -verbose -nocolor -DUTEST_PATTERN=WebViewTest

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld linux -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage linux -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio linux -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo linux -release -verbose -nocolor

  vulkan-smoke:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libx11-xcb1 libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev mesa-vulkan-drivers xvfb
          # OpenAL Soft needs C++20, and GCC 11 is the Ubuntu 22.04 default
          sudo apt-get install -y g++-12
          echo "CXX=g++-12" >> $GITHUB_ENV

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            wsproto 1.0.0
            crossbyte 1.0.1
            haxelib 4.2.0
            StageWebView 1.1.0
            format 3.8.0
            hxp 1.3.1
            utest 1.13.2

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      # CrossByte, which serves lime test html5, needs Haxe 4.3 to build the tools
      - uses: ./.github/actions/rebuild-lime-tools
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set up Lime
        run: |
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (Linux default Vulkan)
        timeout-minutes: 90
        run: |
          lime rebuild linux -64 -release -nocolor -verbose -nocffi

      - name: Build Vulkan smoke test app
        working-directory: tests/vulkan-smoke
        run: |
          lime build linux -release -verbose -nocolor

      - name: Run Vulkan smoke test app
        working-directory: tests/vulkan-smoke
        timeout-minutes: 5
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          SDL_AUDIODRIVER=dummy xvfb-run -a Export/linux/bin/LimeVulkanSmoke

  macos:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            StageWebView 1.1.0
            wsproto 1.0.0
            crossbyte 1.0.1
            format 3.8.0
            hxp 1.3.1
            utest 1.13.2

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (macOS)
        timeout-minutes: 90
        run: |
          lime rebuild macos -clean -release -arm64 -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: MacArm64-NDLL
          path: |
            ndll/MacArm64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/setup-python@v6
        id: tls-python
        with:
          python-version: '3.12'

      - name: Set trust settings for the HTTPS tests
        working-directory: tests/unit
        run: |
          # Lets the runner change the administrator's trust settings without a password prompt.
          # macOS 15 refuses this change through security authorizationdb, so it is made in the
          # authorization database itself, where class 4 is allow
          sudo sqlite3 /var/db/auth.db "UPDATE rules SET class = 4 WHERE name = 'com.apple.trust-settings.admin'"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain fixtures/trusted-ca.pem
          sudo security add-trusted-cert -d -r deny -k /Library/Keychains/System.keychain fixtures/test-ca.pem
          echo "LIME_TEST_TRUST_SETTINGS=1" >> $GITHUB_ENV

      - name: Run unit tests
        working-directory: tests/unit
        # A deadlock hangs the tests rather than failing them
        timeout-minutes: 30
        env:
          LIME_TEST_PYTHON: ${{ steps.tls-python.outputs.python-path }}
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
          # The clipboard tests replace what the clipboard holds, so they only run here
          LIME_TEST_CLIPBOARD: "1"
          # The trash tests move files to the user's trash, so they only run here
          LIME_TEST_TRASH: "1"
          # NetworkInterfaceTest changes the network with sudo to see onChange, so it only runs here
          LIME_TEST_NETWORK: "1"
        run: |
          python -m unittest discover -s fixtures
          lime test neko -release -verbose -nocolor
          lime test mac -arm64 -release -verbose -nocolor

      - name: Run software OpenGL tests
        working-directory: tests/unit
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          # Skips the GPU, as on a machine without one
          LIME_SOFTWARE_GL: "1"
        run: |
          lime test mac -arm64 -release -verbose -nocolor -Dsoftware-gl -DUTEST_PATTERN=OpenGLTest

      - name: Run video smoke test
        working-directory: tests/video-smoke
        run: |
          lime test mac -arm64 -release -verbose -nocolor

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      # - name: Build HelloWorld sample
      #   run: |
      #     lime create HelloWorld -verbose -nocolor
      #     lime build HelloWorld macos -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage macos -arm64 -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio macos -arm64 -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo macos -arm64 -release -verbose -nocolor

  macos-intel:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15-intel
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install HashLink dependencies
        env:
          # Homebrew no longer builds bottles for Intel macOS, so updating it and
          # upgrading what the runner already has rebuilds cmake, OpenSSL and
          # Python from source, which takes an hour. Only what is missing is
          # installed, from the formulae the runner image came with.
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -euxo pipefail

          rm -f /usr/local/bin/2to3*
          rm -f /usr/local/bin/idle3*
          rm -f /usr/local/bin/pydoc3*
          rm -f /usr/local/bin/python3*
          rm -f /usr/local/bin/pip3*

          for attempt in 1 2 3; do
            if /usr/local/bin/brew install jpeg-turbo libpng libuv libvorbis; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            StageWebView 1.1.0
            wsproto 1.0.0
            crossbyte 1.0.1
            format 3.8.0
            hxp 1.3.1
            utest 1.13.2

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      # CrossByte, which serves lime test html5, needs Haxe 4.3 to build the tools
      - uses: ./.github/actions/rebuild-lime-tools
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set up Lime
        run: |
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (macOS)
        timeout-minutes: 90
        run: |
          lime rebuild macos -clean -release -x86_64 -nocolor -verbose -nocffi

      - name: Rebuild Lime (HashLink macOS)
        timeout-minutes: 90
        run: |
          lime rebuild hl -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Mac64-NDLL
          path: |
            ndll/Mac64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Mac64-Hashlink
          path: |
            templates/bin/hl/Mac64
          if-no-files-found: error

      - uses: actions/setup-python@v6
        id: tls-python
        with:
          python-version: '3.12'

      - name: Run unit tests
        working-directory: tests/unit
        # A deadlock hangs the tests rather than failing them
        timeout-minutes: 30
        env:
          LIME_TEST_PYTHON: ${{ steps.tls-python.outputs.python-path }}
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
          # The clipboard tests replace what the clipboard holds, so they only run here
          LIME_TEST_CLIPBOARD: "1"
          # The trash tests move files to the user's trash, so they only run here
          LIME_TEST_TRASH: "1"
          # NetworkInterfaceTest changes the network with sudo to see onChange, so it only runs here
          LIME_TEST_NETWORK: "1"
        run: |
          python -m unittest discover -s fixtures
          lime test neko -release -verbose -nocolor
          lime test hl -release -verbose -nocolor
          lime test mac -x86_64 -release -verbose -nocolor

      - name: Check a plain hxml HashLink build
        working-directory: tests/plain-hxml
        timeout-minutes: 10
        run: haxe --run Run

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      # - name: Build HelloWorld sample
      #   run: |
      #     lime create HelloWorld -verbose -nocolor
      #     lime build HelloWorld macos -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage macos -x86_64 -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio macos -x86_64 -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo macos -x86_64 -release -verbose -nocolor

  windows:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "33.1"
          accept-license: true

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$Env:HAXE_STD_PATH\.." >> $Env:GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            StageWebView 1.1.0
            wsproto 1.0.0
            crossbyte 1.0.1
            lime-mesa 1.0.0
            format 3.8.0
            hxp 1.3.1
            utest 1.13.2

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      # CrossByte, which serves lime test html5, needs Haxe 4.3 to build the tools
      - uses: ./.github/actions/rebuild-lime-tools
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set up Lime
        run: |
          haxelib run lime setup -alias -y -nocffi
          haxelib run lime config AIR_SDK ${{ env.AIR_HOME }} -eval

      - name: Rebuild Lime (Windows)
        timeout-minutes: 90
        run: |
          lime rebuild windows -32 -release -nocolor -verbose -nocffi
          lime rebuild windows -64 -release -nocolor -verbose -nocffi
          lime rebuild hl -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Windows-NDLL
          path: |
            ndll/Windows/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-NDLL
          path: |
            ndll/Windows64/
            !**/.gitignore
          if-no-files-found: error

      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: Windows-Hashlink
      #     path: |
      #       templates/bin/hl/Windows
      #     if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-Hashlink
          path: |
            templates/bin/hl/Windows64
          if-no-files-found: error

      - uses: actions/setup-python@v6
        id: tls-python
        with:
          python-version: '3.12'

      - name: Run unit tests
        working-directory: tests/unit
        # A deadlock hangs the tests rather than failing them
        timeout-minutes: 30
        env:
          LIME_TEST_PYTHON: ${{ steps.tls-python.outputs.python-path }}
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
          # The clipboard tests replace what the clipboard holds, so they only run here
          LIME_TEST_CLIPBOARD: "1"
          # The trash tests move files to the user's trash, so they only run here
          LIME_TEST_TRASH: "1"
          # StorageVolumeTest mounts a folder on a free drive letter with subst, so it only runs here
          LIME_TEST_VOLUMES: "1"
        run: |
          python -m unittest discover -s fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lime test neko -release -verbose -nocolor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lime test hl -release -verbose -nocolor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lime test air -release -verbose -nocolor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lime test windows -release -verbose -nocolor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check a plain hxml HashLink build
        working-directory: tests/plain-hxml
        timeout-minutes: 10
        run: haxe --run Run

      - name: Run software OpenGL tests
        working-directory: tests/unit
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
          # Skips the GPU, as on a machine without one
          LIME_SOFTWARE_GL: "1"
        run: |
          lime test windows -release -verbose -nocolor -Dsoftware-gl -DUTEST_PATTERN=OpenGLTest

      - name: Check window creation failure and recovery
        working-directory: tests/window-creation
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          lime test neko -release -verbose -nocolor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lime test hl -release -verbose -nocolor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lime test windows -release -verbose -nocolor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native desktop integration through SDL
        working-directory: tests/native-desktop
        timeout-minutes: 5
        run: lime test windows -release -verbose -nocolor

      - name: Check local sockets between processes
        working-directory: tests/local-socket
        timeout-minutes: 5
        run: lime test windows -release -verbose -nocolor

      - name: Run unit tests past 24.8 days
        working-directory: tests/unit
        # A timer stuck at the Int limit hangs the tests rather than failing them
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          # The timer starts 10 s short of 2^31 ms, where an Int millisecond count
          # runs out, so the tests run on across it
          lime test windows -release -verbose -nocolor -Dsimulate_uptime=2147473648

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld windows -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage windows -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio windows -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo windows -release -verbose -nocolor

      - name: Rebuild Lime (Windows, Mingw)
        timeout-minutes: 90
        run: |
          rm ndll/Windows64/*
          lime rebuild windows -Dmingw -D MINGW_ROOT=C:\mingw64 -64 -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-MinGW-NDLL
          path: |
            ndll/Windows64/
            !**/.gitignore
          if-no-files-found: error

  webassembly:
