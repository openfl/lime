name: CI
on: [push, pull_request]

env:
  HAXE_VERSION: 4.2.5
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:

  linux:
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev g++-multilib gcc-multilib libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev
          # GStreamer decodes video in the unit tests
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav xvfb

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.53.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.53/hxcpp-4.3.53.zip
          haxelib --global update haxelib --quiet
          haxelib install ../hxcpp-4.3.53.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (Linux)
        run: |
          lime rebuild linux -32 -release -nocolor -verbose -nocffi
          lime rebuild linux -64 -release -nocolor -verbose -nocffi
          lime rebuild hl -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Linux-NDLL
          path: |
            ndll/Linux/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Linux64-NDLL
          path: |
            ndll/Linux64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Linux64-Hashlink
          path: |
            templates/bin/hl/Linux64
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        env:
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
        run: |
          lime test neko -release -verbose -nocolor
          lime test hl -release -verbose -nocolor
          lime test linux -release -verbose -nocolor

      - name: Run unit tests past 24.8 days
        working-directory: tests/unit
        # A timer stuck at the Int limit hangs the tests rather than failing them
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          # The timer starts 10 s short of 2^31 ms, where an Int millisecond count
          # runs out, so the tests run on across it
          lime test linux -release -verbose -nocolor -Dsimulate_uptime=2147473648

      - name: Run video smoke test
        working-directory: tests/video-smoke
        run: |
          lime build linux -release -verbose -nocolor
          SDL_AUDIODRIVER=dummy xvfb-run -a Export/linux/bin/LimeVideoSmoke

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld linux -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage linux -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio linux -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo linux -release -verbose -nocolor

  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev
          # GStreamer decodes video in the unit tests
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      # krdlab/setup-haxe doesn't support arm64 linux
      # so this is our workaround for now
      - name: Install Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe
          mkdir $HOME/haxelib
          haxelib setup $HOME/haxelib

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.53.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.53/hxcpp-4.3.53.zip
          haxelib --global update haxelib --quiet
          haxelib install ../hxcpp-4.3.53.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (Linux ARM64)
        run: |
          lime rebuild linux -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: LinuxArm64-NDLL
          path: |
            ndll/LinuxArm64/
            !**/.gitignore
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        env:
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
        run: |
          lime test neko -release -verbose -nocolor
          lime test linux -release -verbose -nocolor

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld linux -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage linux -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio linux -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo linux -release -verbose -nocolor

  vulkan-smoke:
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libx11-xcb1 libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev mesa-vulkan-drivers xvfb

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.53.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.53/hxcpp-4.3.53.zip
          haxelib --global update haxelib --quiet
          haxelib install ../hxcpp-4.3.53.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (Linux default Vulkan)
        run: |
          lime rebuild linux -64 -release -nocolor -verbose -nocffi

      - name: Build Vulkan smoke test app
        working-directory: tests/vulkan-smoke
        run: |
          lime build linux -release -verbose -nocolor

      - name: Run Vulkan smoke test app
        working-directory: tests/vulkan-smoke
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          SDL_AUDIODRIVER=dummy xvfb-run -a Export/linux/bin/LimeVulkanSmoke

  macos:
    runs-on: macos-14
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.53.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.53/hxcpp-4.3.53.zip
          haxelib install ../hxcpp-4.3.53.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (macOS)
        run: |
          lime rebuild macos -clean -release -arm64 -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: MacArm64-NDLL
          path: |
            ndll/MacArm64/
            !**/.gitignore
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        env:
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
        run: |
          lime test neko -release -verbose -nocolor
          lime test mac -arm64 -release -verbose -nocolor

      - name: Run video smoke test
        working-directory: tests/video-smoke
        run: |
          lime test mac -arm64 -release -verbose -nocolor

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      # - name: Build HelloWorld sample
      #   run: |
      #     lime create HelloWorld -verbose -nocolor
      #     lime build HelloWorld macos -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage macos -arm64 -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio macos -arm64 -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo macos -arm64 -release -verbose -nocolor

  macos-intel:
    runs-on: macos-15-intel
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install HashLink dependencies
        env:
          # Homebrew no longer builds bottles for Intel macOS, so updating it and
          # upgrading what the runner already has rebuilds cmake, OpenSSL and
          # Python from source, which takes an hour. Only what is missing is
          # installed, from the formulae the runner image came with.
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -euxo pipefail

          rm -f /usr/local/bin/2to3*
          rm -f /usr/local/bin/idle3*
          rm -f /usr/local/bin/pydoc3*
          rm -f /usr/local/bin/python3*
          rm -f /usr/local/bin/pip3*

          for attempt in 1 2 3; do
            if /usr/local/bin/brew install jpeg-turbo libpng libuv libvorbis; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.53.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.53/hxcpp-4.3.53.zip
          haxelib install ../hxcpp-4.3.53.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (macOS)
        run: |
          lime rebuild macos -clean -release -x86_64 -nocolor -verbose -nocffi

      - name: Rebuild Lime (HashLink macOS)
        run: |
          lime rebuild hl -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Mac64-NDLL
          path: |
            ndll/Mac64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Mac64-Hashlink
          path: |
            templates/bin/hl/Mac64
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        env:
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
        run: |
          lime test neko -release -verbose -nocolor
          lime test hl -release -verbose -nocolor
          lime test mac -x86_64 -release -verbose -nocolor

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      # - name: Build HelloWorld sample
      #   run: |
      #     lime create HelloWorld -verbose -nocolor
      #     lime build HelloWorld macos -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage macos -x86_64 -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio macos -x86_64 -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo macos -x86_64 -release -verbose -nocolor

  windows:
    runs-on: windows-latest
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "33.1"
          accept-license: true

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$Env:HAXE_STD_PATH\.." >> $Env:GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.53.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.53/hxcpp-4.3.53.zip
          haxelib install ../hxcpp-4.3.53.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi
          haxelib run lime config AIR_SDK ${{ env.AIR_HOME }} -eval

      - name: Rebuild Lime (Windows)
        run: |
          lime rebuild windows -32 -release -nocolor -verbose -nocffi
          lime rebuild windows -64 -release -nocolor -verbose -nocffi
          lime rebuild hl -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Windows-NDLL
          path: |
            ndll/Windows/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-NDLL
          path: |
            ndll/Windows64/
            !**/.gitignore
          if-no-files-found: error

      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: Windows-Hashlink
      #     path: |
      #       templates/bin/hl/Windows
      #     if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-Hashlink
          path: |
            templates/bin/hl/Windows64
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        env:
          # OpenAL's null output stands in for the sound card runners lack
          ALSOFT_DRIVERS: "null"
        run: |
          lime test neko -release -verbose -nocolor
          lime test hl -release -verbose -nocolor
          lime test air -release -verbose -nocolor
          lime test windows -release -verbose -nocolor

      - name: Run unit tests past 24.8 days
        working-directory: tests/unit
        # A timer stuck at the Int limit hangs the tests rather than failing them
        timeout-minutes: 10
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          # The timer starts 10 s short of 2^31 ms, where an Int millisecond count
          # runs out, so the tests run on across it
          lime test windows -release -verbose -nocolor -Dsimulate_uptime=2147473648

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld windows -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage windows -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio windows -release -verbose -nocolor

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor
          lime build SimpleVideo windows -release -verbose -nocolor

      - name: Rebuild Lime (Windows, Mingw)
        run: |
          rm ndll/Windows64/*
          lime rebuild windows -Dmingw -D MINGW_ROOT=C:\mingw64 -64 -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-MinGW-NDLL
          path: |
            ndll/Windows64/
            !**/.gitignore
          if-no-files-found: error

  webassembly:
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Emscripten NDK
        uses: emscripten-core/setup-emsdk@v16

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.168.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.168/hxcpp-4.3.168.zip
          haxelib install ../hxcpp-4.3.168.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Prepare Lime
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime setup -alias -y -nocffi -eval

      - name: Configure Emscripten support
        run: |
          lime config EMSCRIPTEN_SDK $EMSDK/upstream/emscripten -eval
          lime config -eval

      - name: Rebuild Lime (WebAssembly)
        run: |
          lime rebuild webassembly -release -nocolor -verbose -nocffi -eval

      - uses: actions/upload-artifact@v7
        with:
          name: Emscripten-NDLL
          path: |
            ndll/Emscripten/
            !**/.gitignore
          if-no-files-found: error

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor -eval
          lime build SimpleImage webassembly -release -verbose -nocolor -eval

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor -eval
          lime build SimpleAudio webassembly -release -verbose -nocolor -eval

      - name: Build SimpleVideo sample
        run: |
          lime create SimpleVideo -verbose -nocolor -eval
          lime build SimpleVideo webassembly -release -verbose -nocolor -eval

  android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ndk-version: [r28c, stable]
      fail-fast: false
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        if: matrix.ndk-version != 'stable'
        with:
          ndk-version: ${{ matrix.ndk-version }}

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.53.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.53/hxcpp-4.3.53.zip
          haxelib install ../hxcpp-4.3.53.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Prepare Lime
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime setup -alias -y -nocffi -eval

      - name: Configure Android support
        run: |
          lime config ANDROID_SDK $ANDROID_HOME -eval
          lime config ANDROID_NDK_ROOT ${{ env.LIME_NDK_ROOT }} -eval
          lime config JAVA_HOME $JAVA_HOME -eval
          lime config ANDROID_SETUP true -eval
          lime config -eval
        env:
          LIME_NDK_ROOT: ${{ matrix.ndk-version == 'stable' && '$ANDROID_NDK_ROOT' || steps.setup-ndk.outputs.ndk-path }}

      - name: Rebuild Lime (Android)
        run: |
          lime rebuild android -release -nocolor -verbose -nocffi -eval

      - uses: actions/upload-artifact@v7
        with:
          name: Android-NDLL
          path: |
            ndll/Android/
            !**/.gitignore
          if-no-files-found: error
        if: matrix.ndk-version != 'stable'

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor -eval
          lime build HelloWorld android -release -verbose -nocolor -eval

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor -eval
          lime build SimpleImage android -release -verbose -nocolor -eval

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor -eval
          lime build SimpleAudio android -release -verbose -nocolor -eval

      - name: Build SimpleVideo sample
