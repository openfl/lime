name: CI
on: [push, pull_request]

env:
  HAXE_VERSION: 4.2.5
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:

  linux:
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev g++-multilib gcc-multilib libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.45.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib --global update haxelib --quiet
          haxelib install ../hxcpp-4.3.45.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Verify SDL backend selection (Linux)
        run: |
          set -euo pipefail
          if grep -RInE 'sdl2-compat|SDL2[-_ ]compat' .gitmodules project/Build.xml project/lib/*.xml project/src src/lime tools/platforms include.xml haxelib.json haxelib.xml templates; then
            echo "Lime build files and runtime sources must not reference sdl2-compat"
            exit 1
          fi

          if grep -RInE 'SDL_ENABLE_OLD_NAMES|SDL_GameController|SDL_RWops|#include [<"]SDL[."]|<SDL/' project/src/backend/sdl3 project/Build.xml; then
            echo "SDL3 backend must use SDL3 headers, SDL_Gamepad, and SDL_IOStream APIs directly, with old SDL names disabled"
            exit 1
          fi

          default_hxml="$(lime display tests/vulkan-smoke/project.xml linux -nocolor -nocffi)"
          echo "$default_hxml" | grep -q '^-D linux$'
          if echo "$default_hxml" | grep -q '^-D lime_sdl_sound$'; then
            echo "Default Linux desktop HXML must not define SDL2-only lime_sdl_sound"
            exit 1
          fi

          if lime rebuild linux -64 -release -nocolor -verbose -nocffi -Dlime-sdl2 -DLIME_SDL3; then
            echo "Expected mixed SDL2/SDL3 rebuild to fail"
            exit 1
          fi

          if lime rebuild linux -64 -release -nocolor -verbose -nocffi -DLIME_SDL; then
            echo "Expected direct LIME_SDL desktop rebuild to fail; use lime-sdl2 / LIME_SDL2"
            exit 1
          fi

          if lime rebuild linux -64 -release -nocolor -verbose -nocffi -DLIME_SDL3 -DLIME_SDL_SOUND; then
            echo "Expected SDL3 + SDL_sound rebuild to fail"
            exit 1
          fi

      - name: Rebuild Lime (Linux)
        run: |
          set -euo pipefail

          lime rebuild linux -64 -clean -release -nocolor -verbose -nocffi -Dlime-sdl2 2>&1 | tee linux64-sdl2-rebuild.log
          grep -q -- 'lib/sdl-files.xml' linux64-sdl2-rebuild.log
          grep -q -- 'lib/sdl_sound-files.xml' linux64-sdl2-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DLIME_SDL([[:space:]]|$)' linux64-sdl2-rebuild.log
          grep -q -- 'lib/sdl/include' linux64-sdl2-rebuild.log
          if grep -Eq -- '(^|[[:space:]])-DLIME_SDL3([[:space:]]|$)|lib/sdl3-files\.xml|lib/sdl3/include' linux64-sdl2-rebuild.log; then
            echo "SDL2 fallback rebuild must not include SDL3 defines or include paths"
            exit 1
          fi

          lime rebuild linux -64 -release -nocolor -verbose -nocffi -DLIME_SDL2 2>&1 | tee linux64-sdl2-define-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DLIME_SDL2([[:space:]]|$)' linux64-sdl2-define-rebuild.log
          grep -q -- 'lib/sdl-files.xml' linux64-sdl2-define-rebuild.log
          grep -q -- 'lib/sdl_sound-files.xml' linux64-sdl2-define-rebuild.log
          if grep -Eq -- '(^|[[:space:]])-DLIME_SDL3([[:space:]]|$)|lib/sdl3-files\.xml|lib/sdl3/include' linux64-sdl2-define-rebuild.log; then
            echo "LIME_SDL2 fallback rebuild must not include SDL3 defines or include paths"
            exit 1
          fi

          lime rebuild linux -32 -release -nocolor -verbose -nocffi

          lime rebuild linux -64 -clean -release -nocolor -verbose -nocffi 2>&1 | tee linux64-sdl3-rebuild.log
          grep -q -- 'lib/sdl3-files.xml' linux64-sdl3-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DLIME_SDL3([[:space:]]|$)' linux64-sdl3-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DSDL_DISABLE_OLD_NAMES([[:space:]]|$)' linux64-sdl3-rebuild.log
          grep -q -- 'lib/sdl3/include' linux64-sdl3-rebuild.log
          if grep -Eq -- '(^|[[:space:]])-DLIME_SDL([[:space:]]|$)|lib/sdl-files\.xml|lib/sdl_sound-files\.xml|lib/sdl/include' linux64-sdl3-rebuild.log; then
            echo "Default SDL3 rebuild must not include SDL2 defines or include paths"
            exit 1
          fi

          lime rebuild hl -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Linux-NDLL
          path: |
            ndll/Linux/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Linux64-NDLL
          path: |
            ndll/Linux64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Linux64-Hashlink
          path: |
            templates/bin/hl/Linux64
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        run: |
          lime test neko -release -verbose -nocolor
          lime test hl -release -verbose -nocolor
          lime test linux -release -verbose -nocolor

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld linux -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage linux -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio linux -release -verbose -nocolor

  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev

      # krdlab/setup-haxe doesn't support arm64 linux
      # so this is our workaround for now
      - name: Install Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe
          mkdir $HOME/haxelib
          haxelib setup $HOME/haxelib

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.45.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib --global update haxelib --quiet
          haxelib install ../hxcpp-4.3.45.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (Linux ARM64)
        run: |
          lime rebuild linux -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: LinuxArm64-NDLL
          path: |
            ndll/LinuxArm64/
            !**/.gitignore
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        run: |
          lime test neko -release -verbose -nocolor
          lime test linux -release -verbose -nocolor

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld linux -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage linux -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio linux -release -verbose -nocolor

  vulkan-smoke:
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libx11-xcb1 libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libvulkan-dev mesa-vulkan-drivers xvfb

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.45.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib --global update haxelib --quiet
          haxelib install ../hxcpp-4.3.45.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime (Linux default Vulkan)
        run: |
          lime rebuild linux -64 -release -nocolor -verbose -nocffi

      - name: Build Vulkan smoke test app
        working-directory: tests/vulkan-smoke
        run: |
          lime build linux -release -verbose -nocolor

      - name: Run Vulkan smoke test app
        working-directory: tests/vulkan-smoke
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          SDL_AUDIODRIVER=dummy xvfb-run -a Export/linux/bin/LimeVulkanSmoke

  macos:
    runs-on: macos-14
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install HashLink dependencies
        run: |
          set -euxo pipefail

          if [ ! -x /usr/local/bin/brew ]; then
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
          fi

          rm -f /usr/local/bin/2to3*
          rm -f /usr/local/bin/idle3*
          rm -f /usr/local/bin/pydoc3*
          rm -f /usr/local/bin/python3*
          rm -f /usr/local/bin/pip3*

          for attempt in 1 2 3; do
            if arch -x86_64 /usr/local/bin/brew update && arch -x86_64 /usr/local/bin/brew install jpeg-turbo libpng libuv libvorbis; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.45.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib install ../hxcpp-4.3.45.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Verify SDL backend selection (macOS)
        run: |
          set -euo pipefail
          default_hxml="$(lime display tests/vulkan-smoke/project.xml macos -nocolor -nocffi)"
          echo "$default_hxml" | grep -q '^-D mac$'
          if echo "$default_hxml" | grep -q '^-D lime_sdl_sound$'; then
            echo "Default macOS desktop HXML must not define SDL2-only lime_sdl_sound"
            exit 1
          fi

          if lime rebuild macos -release -64 -nocolor -verbose -nocffi -Dlime-sdl2 -DLIME_SDL3; then
            echo "Expected mixed SDL2/SDL3 rebuild to fail"
            exit 1
          fi

          if lime rebuild macos -release -64 -nocolor -verbose -nocffi -DLIME_SDL; then
            echo "Expected direct LIME_SDL desktop rebuild to fail; use lime-sdl2 / LIME_SDL2"
            exit 1
          fi

          if lime rebuild macos -release -64 -nocolor -verbose -nocffi -DLIME_SDL3 -DLIME_SDL_SOUND; then
            echo "Expected SDL3 + SDL_sound rebuild to fail"
            exit 1
          fi

      - name: Rebuild Lime (macOS)
        run: |
          set -euo pipefail

          lime rebuild macos -release -64 -nocolor -verbose -nocffi -Dlime-sdl2 2>&1 | tee macos64-sdl2-rebuild.log
          grep -q -- 'lib/sdl-files.xml' macos64-sdl2-rebuild.log
          grep -q -- 'lib/sdl_sound-files.xml' macos64-sdl2-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DLIME_SDL([[:space:]]|$)' macos64-sdl2-rebuild.log
          grep -q -- 'lib/sdl/include' macos64-sdl2-rebuild.log
          if grep -Eq -- '(^|[[:space:]])-DLIME_SDL3([[:space:]]|$)|lib/sdl3-files\.xml|lib/sdl3/include' macos64-sdl2-rebuild.log; then
            echo "SDL2 fallback rebuild must not include SDL3 defines or include paths"
            exit 1
          fi

          lime rebuild macos -release -64 -nocolor -verbose -nocffi -DLIME_SDL2 2>&1 | tee macos64-sdl2-define-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DLIME_SDL2([[:space:]]|$)' macos64-sdl2-define-rebuild.log
          grep -q -- 'lib/sdl-files.xml' macos64-sdl2-define-rebuild.log
          grep -q -- 'lib/sdl_sound-files.xml' macos64-sdl2-define-rebuild.log
          if grep -Eq -- '(^|[[:space:]])-DLIME_SDL3([[:space:]]|$)|lib/sdl3-files\.xml|lib/sdl3/include' macos64-sdl2-define-rebuild.log; then
            echo "LIME_SDL2 fallback rebuild must not include SDL3 defines or include paths"
            exit 1
          fi

          lime rebuild macos -clean -release -64 -nocolor -verbose -nocffi 2>&1 | tee macos64-sdl3-rebuild.log
          grep -q -- 'lib/sdl3-files.xml' macos64-sdl3-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DLIME_SDL3([[:space:]]|$)' macos64-sdl3-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DSDL_DISABLE_OLD_NAMES([[:space:]]|$)' macos64-sdl3-rebuild.log
          grep -q -- 'lib/sdl3/include' macos64-sdl3-rebuild.log
          if grep -Eq -- '(^|[[:space:]])-DLIME_SDL([[:space:]]|$)|lib/sdl-files\.xml|lib/sdl_sound-files\.xml|lib/sdl/include' macos64-sdl3-rebuild.log; then
            echo "Default SDL3 rebuild must not include SDL2 defines or include paths"
            exit 1
          fi

          lime rebuild macos -clean -release -arm64 -nocolor -verbose -nocffi 2>&1 | tee macos-arm64-sdl3-rebuild.log
          grep -q -- 'lib/sdl3-files.xml' macos-arm64-sdl3-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DLIME_SDL3([[:space:]]|$)' macos-arm64-sdl3-rebuild.log
          grep -Eq -- '(^|[[:space:]])-DSDL_DISABLE_OLD_NAMES([[:space:]]|$)' macos-arm64-sdl3-rebuild.log
          grep -q -- 'lib/sdl3/include' macos-arm64-sdl3-rebuild.log
          if grep -Eq -- '(^|[[:space:]])-DLIME_SDL([[:space:]]|$)|lib/sdl-files\.xml|lib/sdl_sound-files\.xml|lib/sdl/include' macos-arm64-sdl3-rebuild.log; then
            echo "Default SDL3 arm64 rebuild must not include SDL2 defines or include paths"
            exit 1
          fi

      - name: Rebuild Lime (HashLink macOS)
        run: |
          lime rebuild hl -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Mac64-NDLL
          path: |
            ndll/Mac64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: MacArm64-NDLL
          path: |
            ndll/MacArm64/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Mac64-Hashlink
          path: |
            templates/bin/hl/Mac64
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        run: |
          lime test neko -release -verbose -nocolor
          lime test hl -release -verbose -nocolor
          lime test mac -release -verbose -nocolor

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      # - name: Build HelloWorld sample
      #   run: |
      #     lime create HelloWorld -verbose -nocolor
      #     lime build HelloWorld macos -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage macos -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio macos -release -verbose -nocolor

  windows:
    runs-on: windows-latest
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "33.1"
          accept-license: true

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$Env:HAXE_STD_PATH\.." >> $Env:GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.45.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib install ../hxcpp-4.3.45.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install utest --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi
          haxelib run lime config AIR_SDK ${{ env.AIR_HOME }} -eval

      - name: Verify SDL backend selection (Windows)
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          $defaultHxml = lime display tests/vulkan-smoke/project.xml windows -nocolor -nocffi
          if (-not ($defaultHxml | Select-String -Pattern '^-D windows$' -Quiet)) {
            throw "Default Windows HXML did not define windows"
          }
          if ($defaultHxml | Select-String -Pattern '^-D lime_sdl_sound$' -Quiet) {
            throw "Default Windows desktop HXML must not define SDL2-only lime_sdl_sound"
          }

          lime rebuild windows -64 -release -nocolor -verbose -nocffi -Dlime-sdl2 -DLIME_SDL3
          if ($LASTEXITCODE -eq 0) {
            throw "Expected mixed SDL2/SDL3 rebuild to fail"
          }

          lime rebuild windows -64 -release -nocolor -verbose -nocffi -DLIME_SDL
          if ($LASTEXITCODE -eq 0) {
            throw "Expected direct LIME_SDL desktop rebuild to fail; use lime-sdl2 / LIME_SDL2"
          }

          lime rebuild windows -64 -release -nocolor -verbose -nocffi -DLIME_SDL3 -DLIME_SDL_SOUND
          if ($LASTEXITCODE -eq 0) {
            throw "Expected SDL3 + SDL_sound rebuild to fail"
          }
          exit 0

      - name: Rebuild Lime (Windows)
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          function Assert-LogContains($Path, $Pattern, $Message) {
            if (-not (Get-Content $Path | Select-String -Pattern $Pattern -Quiet)) {
              throw $Message
            }
          }

          function Assert-LogMissing($Path, $Pattern, $Message) {
            if (Get-Content $Path | Select-String -Pattern $Pattern -Quiet) {
              throw $Message
            }
          }

          lime rebuild windows -64 -release -nocolor -verbose -nocffi -Dlime-sdl2 2>&1 | Tee-Object -FilePath windows64-sdl2-rebuild.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Assert-LogContains windows64-sdl2-rebuild.log 'lib[\\/]sdl-files\.xml' "Windows SDL2 fallback rebuild did not include sdl-files.xml"
          Assert-LogContains windows64-sdl2-rebuild.log 'lib[\\/]sdl_sound-files\.xml' "Windows SDL2 fallback rebuild did not include sdl_sound-files.xml"
          Assert-LogContains windows64-sdl2-rebuild.log '(^|\s)-DLIME_SDL(\s|$)' "Windows SDL2 fallback rebuild did not define LIME_SDL"
          Assert-LogContains windows64-sdl2-rebuild.log 'lib[\\/]sdl[\\/]include' "Windows SDL2 fallback rebuild did not include SDL2 headers"
          Assert-LogMissing windows64-sdl2-rebuild.log '(^|\s)-DLIME_SDL3(\s|$)|lib[\\/]sdl3-files\.xml|lib[\\/]sdl3[\\/]include' "Windows SDL2 fallback rebuild must not include SDL3 defines or include paths"

          lime rebuild windows -64 -release -nocolor -verbose -nocffi -DLIME_SDL2 2>&1 | Tee-Object -FilePath windows64-sdl2-define-rebuild.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Assert-LogContains windows64-sdl2-define-rebuild.log '(^|\s)-DLIME_SDL2(\s|$)' "Windows LIME_SDL2 fallback rebuild did not pass LIME_SDL2"
          Assert-LogContains windows64-sdl2-define-rebuild.log 'lib[\\/]sdl-files\.xml' "Windows LIME_SDL2 fallback rebuild did not include sdl-files.xml"
          Assert-LogContains windows64-sdl2-define-rebuild.log 'lib[\\/]sdl_sound-files\.xml' "Windows LIME_SDL2 fallback rebuild did not include sdl_sound-files.xml"
          Assert-LogMissing windows64-sdl2-define-rebuild.log '(^|\s)-DLIME_SDL3(\s|$)|lib[\\/]sdl3-files\.xml|lib[\\/]sdl3[\\/]include' "Windows LIME_SDL2 fallback rebuild must not include SDL3 defines or include paths"

          lime rebuild windows -32 -release -nocolor -verbose -nocffi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          lime rebuild windows -64 -release -nocolor -verbose -nocffi 2>&1 | Tee-Object -FilePath windows64-sdl3-rebuild.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Assert-LogContains windows64-sdl3-rebuild.log 'lib[\\/]sdl3-files\.xml' "Windows default rebuild did not include sdl3-files.xml"
          Assert-LogContains windows64-sdl3-rebuild.log '(^|\s)-DLIME_SDL3(\s|$)' "Windows default rebuild did not define LIME_SDL3"
          Assert-LogContains windows64-sdl3-rebuild.log '(^|\s)-DSDL_DISABLE_OLD_NAMES(\s|$)' "Windows default SDL3 rebuild did not disable old SDL names"
          Assert-LogContains windows64-sdl3-rebuild.log 'lib[\\/]sdl3[\\/]include' "Windows default rebuild did not include SDL3 headers"
          Assert-LogMissing windows64-sdl3-rebuild.log '(^|\s)-DLIME_SDL(\s|$)|lib[\\/]sdl-files\.xml|lib[\\/]sdl_sound-files\.xml|lib[\\/]sdl[\\/]include' "Windows default SDL3 rebuild must not include SDL2 defines or include paths"

          lime rebuild hl -clean -release -nocolor -verbose -nocffi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: Windows-NDLL
          path: |
            ndll/Windows/
            !**/.gitignore
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-NDLL
          path: |
            ndll/Windows64/
            !**/.gitignore
          if-no-files-found: error

      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: Windows-Hashlink
      #     path: |
      #       templates/bin/hl/Windows
      #     if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-Hashlink
          path: |
            templates/bin/hl/Windows64
          if-no-files-found: error

      - name: Run unit tests
        working-directory: tests/unit
        run: |
          lime test neko -release -verbose -nocolor
          lime test hl -release -verbose -nocolor
          lime test air -release -verbose -nocolor
          lime test windows -release -verbose -nocolor

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor
          lime build HelloWorld windows -release -verbose -nocolor

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor
          lime build SimpleImage windows -release -verbose -nocolor

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor
          lime build SimpleAudio windows -release -verbose -nocolor

      - name: Rebuild Lime (Windows, Mingw)
        run: |
          rm ndll/Windows64/*
          lime rebuild windows -Dmingw -D MINGW_ROOT=C:\mingw64 -64 -clean -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@v7
        with:
          name: Windows64-MinGW-NDLL
          path: |
            ndll/Windows64/
            !**/.gitignore
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ndk-version: [r28c, stable]
      fail-fast: false
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        if: matrix.ndk-version != 'stable'
        with:
          ndk-version: ${{ matrix.ndk-version }}

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        run: |
          curl --output ../hxcpp-4.3.45.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib install ../hxcpp-4.3.45.zip --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Prepare Lime
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime setup -alias -y -nocffi -eval

      - name: Configure Android support
        run: |
          lime config ANDROID_SDK $ANDROID_HOME -eval
          lime config ANDROID_NDK_ROOT ${{ env.LIME_NDK_ROOT }} -eval
          lime config JAVA_HOME $JAVA_HOME -eval
          lime config ANDROID_SETUP true -eval
          lime config -eval
        env:
          LIME_NDK_ROOT: ${{ matrix.ndk-version == 'stable' && '$ANDROID_NDK_ROOT' || steps.setup-ndk.outputs.ndk-path }}

      - name: Rebuild Lime (Android)
        run: |
          lime rebuild android -release -nocolor -verbose -nocffi -eval

      - uses: actions/upload-artifact@v7
        with:
          name: Android-NDLL
          path: |
            ndll/Android/
            !**/.gitignore
          if-no-files-found: error
        if: matrix.ndk-version != 'stable'

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld sample
        run: |
          lime create HelloWorld -verbose -nocolor -eval
          lime build HelloWorld android -release -verbose -nocolor -eval

      - name: Build SimpleImage sample
        run: |
          lime create SimpleImage -verbose -nocolor -eval
          lime build SimpleImage android -release -verbose -nocolor -eval

      - name: Build SimpleAudio sample
        run: |
          lime create SimpleAudio -verbose -nocolor -eval
          lime build SimpleAudio android -release -verbose -nocolor -eval

      - name: Build Vulkan smoke test app
        working-directory: tests/vulkan-smoke
        run: |
          lime build android -release -verbose -nocolor -eval
